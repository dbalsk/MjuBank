spring:
  datasource:
    url: jdbc:mysql://localhost:3307/mju_bank_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root #본인의 MySQL 아이디
    password: root #본인의 MySQL 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate    #이미 테이블을 만들었으므로 검증만 수행 (안전함)
    show-sql: true          #실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true    #SQL을 예쁘게 포맷팅해서 출력

logging:
  level:
    org.hibernate.SQL: debug