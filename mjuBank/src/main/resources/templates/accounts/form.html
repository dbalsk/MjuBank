<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계좌 개설</title>
    <style>
        .container { width: 500px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>신규 계좌 개설</h2>
    <form action="/accounts/new" method="post">

        <div class="form-group">
            <label>고객 선택 (예금주)</label>
            <select name="customerId" required>
                <option value="">-- 고객을 선택하세요 --</option>
                <option th:each="cust : ${customers}"
                        th:value="${cust.customerId}"
                        th:text="${cust.customerName} + ' (ID:' + ${cust.customerId} + ')'">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>개설 지점</label>
            <select name="branchId" required>
                <option th:each="br : ${branches}"
                        th:value="${br.branchId}"
                        th:text="${br.branchName}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>계좌 종류</label>
            <select name="accountType">
                <option value="보통예금">보통예금 (자유입출금)</option>
                <option value="정기적금">정기적금</option>
                <option value="마이너스통장">마이너스통장</option>
            </select>
        </div>

        <div class="form-group">
            <label>카드 신청 여부</label>
            <select name="cardApplied">
                <option value="N">미신청 (N)</option>
                <option value="Y">신청 (Y)</option>
            </select>
        </div>

        <button type="submit">계좌 개설하기</button>
        <button type="button" onclick="location.href='/accounts'">취소</button>
    </form>
</div>
</body>
</html>
