<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계좌 목록</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<div style="width: 90%; margin: 0 auto; padding-top: 30px;">
    <h1>💰 계좌 관리 시스템</h1>

    <button onclick="location.href='/accounts/new'">+ 신규 계좌 개설</button>
    <button onclick="location.href='/'">메인으로</button>

    <table>
        <thead>
        <tr>
            <th>계좌ID(PK)</th>
            <th>고객명</th>
            <th>계좌종류</th>
            <th>잔액</th>
            <th>개설일</th>
            <th>카드신청</th>
            <th>담당지점</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="acc : ${accounts}">
            <td th:text="${acc.accountId}"></td>
            <td th:text="${acc.customer.customerName}"></td>
            <td th:text="${acc.accountType}"></td>
            <td th:text="${#numbers.formatInteger(acc.accountBalance, 0, 'COMMA')} + '원'"></td>
            <td th:text="${acc.accountOpenDate}"></td>
            <td th:text="${acc.cardApplied}"></td>
            <td th:text="${acc.branch != null ? acc.branch.branchName : '-'}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
