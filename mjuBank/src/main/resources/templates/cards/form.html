<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카드 발급</title>
    <style>
        .container { width: 500px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #6610f2; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>💳 신규 카드 발급</h2>
    <form action="/cards/new" method="post">

        <div class="form-group">
            <label>연결할 계좌 선택 (필수)</label>
            <select name="accountId" required>
                <option value="">-- 계좌를 선택하세요 --</option>
                <option th:each="acc : ${accounts}"
                        th:value="${acc.accountId}"
                        th:text="'[' + ${acc.customer.customerName} + '] ' + ${acc.accountId} + ' (' + ${acc.accountType} + ')'">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>카드 종류</label>
            <select name="cardType">
                <option value="신용카드">신용카드</option>
                <option value="체크카드">체크카드</option>
                <option value="법인카드">법인카드</option>
            </select>
        </div>

        <div class="form-group">
            <label>한도 금액 (원)</label>
            <input type="number" name="cardLimit" value="1000000" required>
        </div>

        <div class="form-group">
            <label>결제일</label>
            <select name="cardPaymentDay">
                <option value="1일">매월 1일</option>
                <option value="15일">매월 15일</option>
                <option value="25일">매월 25일</option>
                <option value="매월말일">매월 말일</option>
            </select>
        </div>

        <button type="submit">카드 발급하기</button>
        <button type="button" onclick="location.href='/cards'">취소</button>
    </form>
</div>
</body>
</html>
