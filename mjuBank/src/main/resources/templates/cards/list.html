<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카드 목록</title>
    <style>
        .container { width: 90%; margin: 0 auto; padding-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .search-box { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>💳 카드 관리 시스템</h1>

    <div class="search-box">
        <form action="/cards" method="get">
            <strong>고객 번호(ID)로 검색: </strong>
            <input type="number" name="customerId" th:value="${searchId}" placeholder="예: 1">
            <button type="submit">검색</button>
            <a href="/cards"><button type="button">전체 보기</button></a>
        </form>
    </div>

    <button onclick="location.href='/cards/new'" style="background-color: #6610f2; color: white; padding: 10px;">+ 신규 카드 발급</button>
    <button onclick="location.href='/'">메인으로</button>

    <table>
        <thead>
        <tr>
            <th>카드ID</th>
            <th>고객ID</th>
            <th>카드종류</th>
            <th>한도금액</th>
            <th>결제일</th>
            <th>신청일</th>
            <th>연결계좌번호</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="card : ${cards}">
            <td th:text="${card.cardId}"></td>
            <td th:text="${card.customer.customerName} + ' (' + ${card.customer.customerId} + ')'"></td>
            <td th:text="${card.cardType}"></td>
            <td th:text="${#numbers.formatInteger(card.cardLimit, 0, 'COMMA')} + '원'"></td>
            <td th:text="${card.cardPaymentDay}"></td>
            <td th:text="${card.cardApplyDate}"></td>
            <td th:text="${card.account.accountId}"></td>
        </tr>
        <tr th:if="${cards.isEmpty()}">
            <td colspan="7">발급된 카드가 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
