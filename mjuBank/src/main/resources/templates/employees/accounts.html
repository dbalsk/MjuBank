<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>직원 실적 조회</title>
    <style>
        .container { width: 80%; margin: 0 auto; padding-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<div class="container">
    <h1>직원별 담당 계좌 조회</h1>

    <form action="/employees/accounts" method="get" style="background: #f1f1f1; padding: 15px; border-radius: 5px;">
        <label><strong>담당 직원 선택: </strong></label>
        <select name="empName" required>
            <option value="">-- 직원 선택 --</option>
            <option th:each="emp : ${employees}"
                    th:value="${emp.employeeName}"
                    th:text="${emp.employeeName} + ' (' + ${emp.branch != null ? emp.branch.branchName : '본사'} + ')'"
                    th:selected="${emp.employeeName == searchName}">
            </option>
        </select>
        <button type="submit" style="background-color: #17a2b8; color: white; border: none; padding: 5px 15px;">조회</button>
        <a href="/"><button type="button">메인으로</button></a>
    </form>

    <div th:if="${accounts != null}">
        <h3 style="margin-top: 30px;">
            <span th:text="${searchName}"></span> 직원이 관리하는 계좌:
            <span style="color: blue;" th:text="${accounts.size()}"></span>건
        </h3>

        <table th:if="${!accounts.isEmpty()}">
            <thead>
            <tr>
                <th>계좌ID</th>
                <th>고객명</th>
                <th>계좌종류</th>
                <th>잔액</th>
                <th>개설일</th>
                <th>지점</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="acc : ${accounts}">
                <td th:text="${acc.accountId}"></td>
                <td th:text="${acc.customer.customerName}"></td>
                <td th:text="${acc.accountType}"></td>
                <td th:text="${#numbers.formatInteger(acc.accountBalance, 0, 'COMMA')} + '원'"></td>
                <td th:text="${acc.accountOpenDate}"></td>
                <td th:text="${acc.branch != null ? acc.branch.branchName : '-'}"></td>
            </tr>
            </tbody>
        </table>

        <p th:if="${accounts.isEmpty()}" style="color: gray; margin-top: 20px;">
            담당하고 있는 계좌 내역이 없습니다.
        </p>
    </div>
</div>
</body>
</html>
