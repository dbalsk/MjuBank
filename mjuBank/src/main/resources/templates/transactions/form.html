<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>입출금 거래</title>
    <style>
        .container { width: 500px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>입출금 거래</h2>
    <form action="/transactions/new" method="post">

        <div class="form-group">
            <label>거래할 계좌 선택</label>
            <select name="accountId" required>
                <option value="">-- 계좌를 선택하세요 --</option>
                <option th:each="acc : ${accounts}"
                        th:value="${acc.accountId}"
                        th:text="'[' + ${acc.customer.customerName} + '] ' + ${acc.accountId} + ' (잔액: ' + ${acc.accountBalance} + '원)'">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>거래 종류</label>
            <select name="type">
                <option value="DEPOSIT">입금 (Deposit)</option>
                <option value="WITHDRAW">출금 (Withdraw)</option>
            </select>
        </div>

        <div class="form-group">
            <label>거래 금액</label>
            <input type="number" name="amount" placeholder="0" required>
        </div>

        <div class="form-group">
            <label>거래 내용</label>
            <input type="text" name="desc" placeholder="예: 월급, 용돈">
        </div>

        <button type="submit">거래 실행</button>
        <button type="button" onclick="location.href='/accounts'">취소</button>
    </form>
</div>
</body>
</html>
